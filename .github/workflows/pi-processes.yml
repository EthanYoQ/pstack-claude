name: Pi Windows processes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pi-processes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Pi process lifecycle
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Test owned process trees and stale PID protection
        run: bun test tests/pi/process-lifecycle.test.mjs tests/pi/child.test.mjs
