name: Pstack audit snapshot

on:
  push:
    branches: [codex/pstack-audit-snapshot-20261005]

permissions:
  contents: read

jobs:
  processes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: git apply audit-windows-process.patch
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test tests/pi/process-lifecycle.test.mjs tests/pi/child.test.mjs
      - name: Install Pi for strict type verification
        if: runner.os == 'Linux'
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.0.0
      - name: Typecheck Pi
        if: runner.os == 'Linux'
        run: bun tools/typecheck-pi.mjs
