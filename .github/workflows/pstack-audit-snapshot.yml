name: Pstack audit snapshot

on:
  push:
    branches: [codex/pstack-audit-snapshot-20261005]

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.fix }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - fix: codex-audit
            ref: c73611043e702f1083387c805444820c4d5573b5
            os: ubuntu-latest
            tests: tests/worktree-codex.test.mjs
          - fix: codex-audit
            ref: c73611043e702f1083387c805444820c4d5573b5
            os: windows-latest
            tests: tests/worktree-codex.test.mjs
          - fix: pi-processes
            ref: 0597e7d4b53b18baccb61cff6fc05893b704509d
            os: ubuntu-latest
            tests: tests/pi/process-lifecycle.test.mjs tests/pi/child.test.mjs
          - fix: pi-processes
            ref: 0597e7d4b53b18baccb61cff6fc05893b704509d
            os: windows-latest
            tests: tests/pi/process-lifecycle.test.mjs tests/pi/child.test.mjs
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Native regression tests
        run: bun test ${{ matrix.tests }}
      - name: Generated invariants and full Linux test suite
        if: runner.os == 'Linux'
        run: |
          bun tools/generate.mjs --check
          bun test tests/
      - name: Workflow lint
        if: runner.os == 'Linux' && matrix.fix == 'pi-processes'
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -no-color
      - name: Markdown lint
        if: runner.os == 'Linux' && matrix.fix == 'codex-audit'
        run: npx --yes markdownlint-cli2@0.18.1 '**/*.md'
